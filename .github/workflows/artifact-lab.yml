name: Artifact Lab

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: [self-hosted, devops-lab]

    steps:
      - name: Create build artifact
        run: |
          mkdir -p build
          echo "Build generated successfully" > build/build-info.txt
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build/

  deploy:
    name: Deploy
    runs-on: [self-hosted, devops-lab]
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Verify artifact
        run: |
          ls -la
          ls -la build
          cat build/build-info.txt
