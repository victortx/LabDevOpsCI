name: CI Docker Compose

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build and test Docker stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t nginx-parcial-proxy:ci .

      - name: Start stack
        run: ./scripts/ci-up.sh

      - name: Check containers
        run: docker compose ps

      - name: Run healthcheck
        run: ./scripts/healthcheck.sh

      - name: Test expenses endpoint
        run: curl -f http://localhost/api/expenses

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: ./scripts/ci-down.sh 
