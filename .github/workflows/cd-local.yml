name: CD Local Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-secrets:
    name: Test Secrets and Variables
    runs-on: [self-hosted, devops-lab]
    environment: development

    steps:
      - name: Show configuration
        run: |
          echo "APP_PORT=${{ vars.APP_PORT }}"
          echo "NODE_ENV=${{ vars.NODE_ENV }}"

      - name: Check DB password exists
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD is configured"
          else
            echo "DB_PASSWORD is NOT configured"
            exit 1
          fi

  deploy-local:
    name: Deploy to local Ubuntu runner
    runs-on: [self-hosted, devops-lab]
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          whoami
          hostname
          pwd
          docker --version
          docker compose version

      - name: Prepare environment file
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD secret is missing."
            exit 1
          fi

          cat > .env <<EOF
          PORT=3000
          DB_HOST=postgres
          DB_PORT=5432
          DB_NAME=devops_lab
          DB_USER=devops_user
          DB_PASSWORD=$DB_PASSWORD
          EOF

      - name: Run deployment
        run: ./scripts/deploy.sh

      - name: Validate deployment
        run: curl -f http://localhost/health

      - name: Show containers
        if: always()
        run: docker compose ps

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
